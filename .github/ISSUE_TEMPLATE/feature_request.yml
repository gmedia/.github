name: Feature request
description: Propose a change or new capability in a GMEDIA project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem rather than a specific implementation — it usually
        leads to a better solution than the one either of us had in mind first.

        For substantial changes, please open this issue and agree on an approach
        before writing the implementation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing open and closed issues and did not find a duplicate.
          required: true

  - type: input
    id: project
    attributes:
      label: Project
      description: Which project or component does this concern? Skip this if the repository is obvious.
      placeholder: labuh
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What are you trying to do, and what makes it hard or impossible today?
        Concrete situations are more useful than general statements.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What behaviour would you expect? Include interfaces or configuration if you have something specific in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at, including workarounds you are using now, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Prior art, related issues, links, or anything else worth knowing.
    validations:
      required: false
